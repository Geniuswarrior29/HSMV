<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donor Admin | HSMV Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBlue: '#0b1d3a',
                        royalBlue: '#1e40af',
                        brightRed: '#dc2626',
                        cleanBg: '#fdfdfd'
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-cleanBg text-gray-700 font-sans antialiased">
    
    <div class="max-w-6xl mx-auto px-4 py-8 space-y-8">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-200 pb-6">
            <div class="flex items-center gap-4">
                <div class="bg-red-50 p-3 rounded-full">
                    <i class="fas fa-heartbeat text-3xl text-brightRed"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black text-darkBlue tracking-tight">Blood Donor Admin</h1>
                    <p class="text-sm text-gray-500 mt-1">Manage blood donor database securely.</p>
                </div>
            </div>
            <div class="flex gap-3">
                <a href="blood-donor.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm px-5 py-2.5 rounded-lg transition-colors inline-flex items-center gap-2">
                    <i class="fas fa-eye"></i> View Public Page
                </a>
            </div>
        </div>

        <!-- Add Donor Form -->
        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm p-6 lg:p-8 fade-in">
            <h2 class="text-xl font-bold text-darkBlue mb-6 border-b border-gray-100 pb-3">Register New Donor</h2>
            <form id="addDonorForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Full Name *</label>
                    <input type="text" id="donorName" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all" placeholder="Enter name">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Mobile Number *</label>
                    <input type="tel" id="donorNumber" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all" placeholder="Enter number">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Email (Optional)</label>
                    <input type="email" id="donorEmail" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all" placeholder="Enter email">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Blood Group *</label>
                    <select id="donorGroup" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all bg-white">
                        <option value="" disabled selected>Select Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="lg:col-span-4 flex justify-end mt-2">
                    <button type="submit" class="bg-brightRed hover:bg-red-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-all flex items-center gap-2 transform hover:-translate-y-0.5">
                        <i class="fas fa-plus-circle"></i> Add Donor
                    </button>
                </div>
            </form>
        </div>

        <!-- Donors List -->
        <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden fade-in" style="animation-delay: 0.1s;">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold text-darkBlue">Donor Database</h2>
                <span id="donorCount" class="bg-brightRed text-white text-xs font-bold px-3 py-1 rounded-full">0 Donors</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white border-b border-gray-100 text-gray-400 font-bold uppercase tracking-wider text-xs">
                            <th class="p-5">Name</th>
                            <th class="p-5">Blood Group</th>
                            <th class="p-5">Contact Number</th>
                            <th class="p-5">Email</th>
                            <th class="p-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="donorTableBody" class="divide-y divide-gray-100">
                        <!-- Dynamic content will be loaded here -->
                    </tbody>
                </table>
                <div id="emptyState" class="hidden p-12 text-center text-gray-400 flex flex-col items-center justify-center">
                    <i class="fas fa-inbox text-5xl mb-4 text-gray-200"></i>
                    <p class="text-lg">No donors registered yet.</p>
                    <p class="text-sm mt-1">Add a new donor using the form above.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // PASTE YOUR GOOGLE SCRIPT WEB APP URL HERE
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLgbjITZNfDymYtXoRvxJRN2JbbvFPEAECEw0Ye9RHIOMMUPHLS-eWPf9SYix1jfVW/exec";

        // DOM Elements
        const addDonorForm = document.getElementById('addDonorForm');
        const donorTableBody = document.getElementById('donorTableBody');
        const emptyState = document.getElementById('emptyState');
        const donorCount = document.getElementById('donorCount');

        // Global list to keep track
        let currentDonors = [];

        function renderDonors(donors) {
            donorTableBody.innerHTML = '';
            donorCount.textContent = `${donors.length} Donor${donors.length !== 1 ? 's' : ''}`;

            if (donors.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                donors.forEach((donor, index) => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 transition-colors group";
                    
                    let bgBadgeClass = "bg-red-100 text-red-700";
                    if(donor.group.includes('O')) bgBadgeClass = "bg-blue-100 text-blue-700";
                    else if(donor.group.includes('AB')) bgBadgeClass = "bg-purple-100 text-purple-700";
                    
                    row.innerHTML = `
                        <td class="p-5 font-bold text-darkBlue">${donor.name}</td>
                        <td class="p-5">
                            <span class="px-3 py-1 rounded-full text-xs font-black ${bgBadgeClass}">
                                <i class="fas fa-tint mr-1"></i> ${donor.group}
                            </span>
                        </td>
                        <td class="p-5 text-gray-600">${donor.number}</td>
                        <td class="p-5 text-gray-600">${donor.email || '<span class="text-gray-400 italic">N/A</span>'}</td>
                        <td class="p-5 text-right">
                            <button onclick="deleteDonor('${donor.id}')" class="text-gray-400 hover:text-brightRed bg-white hover:bg-red-50 w-8 h-8 rounded-full transition-all opacity-0 group-hover:opacity-100">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    `;
                    donorTableBody.appendChild(row);
                });
            }
        }

        async function fetchDonors() {
            if(GOOGLE_SCRIPT_URL === "YOUR_WEB_APP_URL_HERE") {
                donorTableBody.innerHTML = '<tr><td colspan="5" class="p-5 text-center text-red-500 font-bold">Please add your Google Script URL in the code!</td></tr>';
                return;
            }
            
            donorTableBody.innerHTML = '<tr><td colspan="5" class="p-5 text-center text-gray-400"><i class="fas fa-sync animate-spin mr-2"></i>Loading from Google Sheets...</td></tr>';
            
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + "?action=read");
                const data = await res.json();
                currentDonors = data;
                renderDonors(data);
            } catch (error) {
                console.error(error);
                donorTableBody.innerHTML = '<tr><td colspan="5" class="p-5 text-center text-red-500">Failed to load data.</td></tr>';
            }
        }

        async function addDonor(e) {
            e.preventDefault();
            if(GOOGLE_SCRIPT_URL === "YOUR_WEB_APP_URL_HERE") {
                alert("Please add your Google Script URL first!");
                return;
            }
            
            const btn = addDonorForm.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const name = encodeURIComponent(document.getElementById('donorName').value.trim());
            const number = encodeURIComponent(document.getElementById('donorNumber').value.trim());
            const email = encodeURIComponent(document.getElementById('donorEmail').value.trim());
            const group = encodeURIComponent(document.getElementById('donorGroup').value);
            
            try {
                const url = `${GOOGLE_SCRIPT_URL}?action=add&name=${name}&number=${number}&email=${email}&group=${group}`;
                await fetch(url);
                
                addDonorForm.reset();
                fetchDonors(); // Refresh list
                
                btn.innerHTML = '<i class="fas fa-check"></i> Added';
                btn.classList.add('bg-green-600');
            } catch (error) {
                alert("Failed to save donor.");
            } finally {
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('bg-green-600');
                    btn.disabled = false;
                }, 2000);
            }
        }

        async function deleteDonor(id) {
            if(confirm('Are you sure you want to remove this donor?')) {
                donorTableBody.innerHTML = '<tr><td colspan="5" class="p-5 text-center text-gray-400"><i class="fas fa-trash animate-bounce mr-2"></i>Deleting...</td></tr>';
                try {
                    await fetch(`${GOOGLE_SCRIPT_URL}?action=delete&id=${id}`);
                    fetchDonors();
                } catch(error) {
                    alert("Failed to delete donor.");
                    fetchDonors();
                }
            }
        }

        // Event Listeners
        addDonorForm.addEventListener('submit', addDonor);

        // Initial Render
        document.addEventListener('DOMContentLoaded', fetchDonors);
    </script>
</body>
</html>
