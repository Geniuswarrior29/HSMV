<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Blood Donor | HSMV Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBlue: '#0b1d3a',
                        royalBlue: '#1e40af',
                        brightRed: '#dc2626',
                        cleanBg: '#fdfdfd'
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-cleanBg text-gray-700 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- Hero Section -->
    <div class="bg-darkBlue py-16 px-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
        <div class="max-w-6xl mx-auto text-center relative z-10 flex flex-col items-center">
            <a href="index.html" class="mb-4 text-blue-200 hover:text-white transition-colors text-sm font-semibold tracking-wide uppercase"><i class="fas fa-arrow-left mr-2"></i> Back to Home</a>
            <img src="https://i.ibb.co/dJ1jRjJm/IMG-20260420-WA0112-6.jpg" alt="HSMV Logo" class="w-24 h-24 mx-auto object-contain rounded-full mb-6 border-4 border-white shadow-xl shadow-black/30 bg-white">
            <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-4">Register as a Blood Donor</h1>
            <p class="text-blue-100 text-lg max-w-2xl mx-auto font-light leading-relaxed">
                Your single donation can save up to three lives. Fill out the form below to join our life-saving community.
            </p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-3xl mx-auto px-4 py-12 flex-grow w-full relative -mt-10 z-20">
        
        <div class="bg-white border border-gray-100 rounded-2xl shadow-lg p-6 lg:p-10 fade-in">
            <h2 class="text-2xl font-bold text-darkBlue mb-8 border-b border-gray-100 pb-4 flex items-center gap-3">
                <i class="fas fa-hand-holding-medical text-brightRed"></i> Donor Information
            </h2>
            
            <form id="addDonorForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Full Name *</label>
                    <input type="text" id="donorName" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all bg-gray-50 focus:bg-white" placeholder="Enter your name">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Mobile Number *</label>
                    <input type="tel" id="donorNumber" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all bg-gray-50 focus:bg-white" placeholder="Enter your mobile number">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Email (Optional)</label>
                    <input type="email" id="donorEmail" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all bg-gray-50 focus:bg-white" placeholder="Enter your email address">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Blood Group *</label>
                    <select id="donorGroup" required class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all bg-gray-50 focus:bg-white">
                        <option value="" disabled selected>Select your Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">City</label>
                    <input type="text" id="donorCity" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all bg-gray-50 focus:bg-white" placeholder="Enter your city">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Full Address</label>
                    <input type="text" id="donorAddress" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all bg-gray-50 focus:bg-white" placeholder="Enter your full address">
                </div>
                <div class="space-y-2 md:col-span-2">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Added By (Referrer Name - Optional)</label>
                    <input type="text" id="donorAddedBy" class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brightRed focus:ring-1 focus:ring-brightRed transition-all bg-gray-50 focus:bg-white" placeholder="Did someone refer you? Enter their name">
                </div>
                
                <div id="formMessage" class="md:col-span-2 hidden p-4 rounded-xl text-center font-semibold transition-all"></div>

                <div class="md:col-span-2 flex flex-col sm:flex-row gap-4 items-center justify-between mt-6 pt-6 border-t border-gray-100">
                    <a href="blood-donor.html" class="text-royalBlue hover:text-blue-800 font-semibold transition-colors flex items-center gap-2">
                        <i class="fas fa-list"></i> View Donor List
                    </a>
                    <button type="submit" class="w-full sm:w-auto bg-brightRed hover:bg-red-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 transform hover:-translate-y-0.5">
                        <i class="fas fa-heart"></i> Register Now
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm text-gray-500">
                &copy; <script>document.write(new Date().getFullYear())</script> HSMV Foundation. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        // Use the same script URL to submit to the same sheet
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLgbjITZNfDymYtXoRvxJRN2JbbvFPEAECEw0Ye9RHIOMMUPHLS-eWPf9SYix1jfVW/exec";

        const addDonorForm = document.getElementById('addDonorForm');
        const formMessage = document.getElementById('formMessage');

        async function addDonor(e) {
            e.preventDefault();
            
            const btn = addDonorForm.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
            btn.disabled = true;
            
            formMessage.classList.add('hidden');
            formMessage.className = 'md:col-span-2 p-4 rounded-xl text-center font-semibold transition-all'; // Reset classes

            const name = encodeURIComponent(document.getElementById('donorName').value.trim());
            const number = encodeURIComponent(document.getElementById('donorNumber').value.trim());
            const email = encodeURIComponent(document.getElementById('donorEmail').value.trim());
            const group = encodeURIComponent(document.getElementById('donorGroup').value);
            const city = encodeURIComponent(document.getElementById('donorCity').value.trim());
            const address = encodeURIComponent(document.getElementById('donorAddress').value.trim());
            const addedby = encodeURIComponent(document.getElementById('donorAddedBy').value.trim());
            
            try {
                const url = `${GOOGLE_SCRIPT_URL}?action=add&name=${name}&number=${number}&email=${email}&group=${group}&city=${city}&address=${address}&addedby=${addedby}`;
                const response = await fetch(url);
                
                if (response.ok) {
                    addDonorForm.reset();
                    btn.innerHTML = '<i class="fas fa-check"></i> Registered';
                    btn.classList.add('bg-green-600');
                    btn.classList.remove('bg-brightRed', 'hover:bg-red-700');
                    
                    formMessage.textContent = 'Thank you for registering as a blood donor!';
                    formMessage.classList.add('bg-green-100', 'text-green-700');
                    formMessage.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = 'blood-donor.html';
                    }, 2000);
                } else {
                    throw new Error('Failed to submit form');
                }
            } catch (error) {
                console.error(error);
                formMessage.textContent = 'Failed to submit registration. Please try again.';
                formMessage.classList.add('bg-red-100', 'text-red-700');
                formMessage.classList.remove('hidden');
                
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }

        addDonorForm.addEventListener('submit', addDonor);
    </script>
</body>
</html>
