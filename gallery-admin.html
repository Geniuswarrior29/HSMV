<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Admin Portal | HSMV Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900"><i class="fas fa-images text-blue-600 mr-2"></i> Gallery Admin Portal</h1>
            <a href="index.html" class="text-blue-600 hover:underline"><i class="fas fa-home"></i> Back to Home</a>
        </div>

        <!-- Upload Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Upload New Photo</h2>
            <form id="uploadForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase">Select Photo *</label>
                    <input type="file" id="photoFile" accept="image/*" required class="w-full border border-gray-200 rounded-lg p-2 focus:outline-none focus:border-blue-500 bg-gray-50">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase">Date *</label>
                    <input type="date" id="photoDate" required class="w-full border border-gray-200 rounded-lg p-2 focus:outline-none focus:border-blue-500 bg-gray-50">
                </div>
                <div class="space-y-1 md:col-span-2">
                    <label class="text-xs font-bold text-gray-500 uppercase">Description *</label>
                    <textarea id="photoDesc" required rows="2" class="w-full border border-gray-200 rounded-lg p-2 focus:outline-none focus:border-blue-500 bg-gray-50" placeholder="Enter photo description..."></textarea>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors flex items-center justify-center w-full md:w-auto">
                        <i class="fas fa-upload mr-2"></i> Upload Photo
                    </button>
                    <div id="uploadStatus" class="mt-2 text-sm font-semibold hidden"></div>
                </div>
            </form>
        </div>

        <!-- Manage Photos Section -->
        <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">Manage Photos</h2>
                <button onclick="loadPhotos()" class="text-blue-600 hover:bg-blue-50 px-3 py-1 rounded transition-colors text-sm"><i class="fas fa-sync-alt mr-1"></i> Refresh</button>
            </div>
            
            <div id="loader" class="text-center py-10 text-gray-500"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><br>Loading...</div>
            
            <div id="photosGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Photos injected here -->
            </div>
        </div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR GALLERY APPS SCRIPT URL AFTER DEPLOYING
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDp4xb_x_qIwn3f7wLj_tVjbWtP2myD83OPPQC8T5ySIx5HgtYvS4gyIpFNbCQUhlpIA/exec"; 

        document.getElementById('photoDate').valueAsDate = new Date();

        // Handle Upload
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (SCRIPT_URL.includes("REPLACE")) {
                alert("Please replace SCRIPT_URL in the code with your deployed Apps Script URL first.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('uploadStatus');
            const fileInput = document.getElementById('photoFile');
            const dateInput = document.getElementById('photoDate');
            const descInput = document.getElementById('photoDesc');

            if(fileInput.files.length === 0) return;
            const file = fileInput.files[0];

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Uploading... (This may take a minute)';
            status.classList.add('hidden');

            // Read file as base64
            const reader = new FileReader();
            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];
                
                const params = new URLSearchParams({
                    action: 'uploadPhoto',
                    date: dateInput.value,
                    description: descInput.value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                });

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: params
                    });
                    
                    const result = await response.json();
                    if(result.result !== "success") throw new Error(result.error);
                    
                    status.textContent = 'Upload successful!';
                    status.className = 'mt-2 text-sm font-semibold text-green-600 block';
                    document.getElementById('uploadForm').reset();
                    document.getElementById('photoDate').valueAsDate = new Date();
                    
                    loadPhotos(); // Refresh grid
                    
                } catch (error) {
                    console.error(error);
                    status.textContent = 'Upload failed: ' + error.message;
                    status.className = 'mt-2 text-sm font-semibold text-red-600 block';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-upload mr-2"></i> Upload Photo';
                }
            };
            
            reader.readAsDataURL(file);
        });

        // Handle Loading Photos
        async function loadPhotos() {
            if (SCRIPT_URL.includes("REPLACE")) return;
            
            const loader = document.getElementById('loader');
            const grid = document.getElementById('photosGrid');
            
            loader.classList.remove('hidden');
            grid.classList.add('hidden');
            grid.innerHTML = '';

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getPhotos`);
                const data = await response.json();
                const photos = data.photos || [];

                if(photos.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No photos uploaded yet.</div>';
                } else {
                    photos.reverse().forEach(photo => {
                        // Format date string carefully
                        let dateStr = photo.date;
                        try {
                            const d = new Date(photo.date);
                            if(!isNaN(d)) dateStr = d.toLocaleDateString();
                        } catch(e) {}
                        
                        // Fix for Google Drive image embedding
                        let displayUrl = photo.imageUrl;
                        if(displayUrl.includes('drive.google.com') && displayUrl.includes('id=')) {
                            const fileId = displayUrl.split('id=')[1].split('&')[0];
                            displayUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
                        }

                        const div = document.createElement('div');
                        div.className = 'bg-gray-50 border border-gray-200 rounded-lg overflow-hidden flex flex-col shadow-sm';
                        div.innerHTML = `
                            <div class="h-48 w-full bg-gray-200 relative">
                                <img src="${displayUrl}" alt="Gallery image" class="w-full h-full object-contain">
                                <div class="absolute top-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded">
                                    <i class="far fa-calendar-alt mr-1"></i> ${dateStr}
                                </div>
                            </div>
                            <div class="p-4 flex flex-col flex-grow">
                                <p class="text-sm text-gray-700 flex-grow mb-4">${photo.description}</p>
                                <button onclick="deletePhoto('${photo.id}')" class="w-full bg-red-100 hover:bg-red-200 text-red-700 py-1.5 rounded text-sm font-semibold transition-colors mt-auto">
                                    <i class="fas fa-trash-alt mr-1"></i> Delete
                                </button>
                            </div>
                        `;
                        grid.appendChild(div);
                    });
                }
                
                loader.classList.add('hidden');
                grid.classList.remove('hidden');
                
            } catch (error) {
                console.error(error);
                loader.innerHTML = '<span class="text-red-500">Failed to load photos.</span>';
            }
        }

        async function deletePhoto(id) {
            if(!confirm('Are you sure you want to delete this photo?')) return;
            
            try {
                const params = new URLSearchParams({ action: 'deletePhoto', id: id });
                await fetch(SCRIPT_URL, { method: 'POST', body: params });
                loadPhotos();
            } catch(e) {
                alert('Failed to delete photo.');
            }
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', loadPhotos);
    </script>
</body>
</html>
