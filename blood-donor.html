<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donors List | HSMV Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBlue: '#0b1d3a',
                        royalBlue: '#1e40af',
                        brightRed: '#dc2626',
                        cleanBg: '#fdfdfd'
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .donor-card {
            transition: all 0.2s ease;
        }
        .donor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-cleanBg text-gray-700 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- Hero Section -->
    <div class="bg-darkBlue py-16 px-4 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
        <div class="max-w-6xl mx-auto text-center relative z-10">
            <img src="https://i.ibb.co/dJ1jRjJm/IMG-20260420-WA0112-6.jpg" alt="HSMV Logo" class="w-24 h-24 mx-auto object-contain rounded-full mb-6 border-4 border-white shadow-xl shadow-black/30 bg-white">
            <h2 class="text-lg md:text-xl font-bold text-blue-200 tracking-wider uppercase mb-2">Helping Society Mission & Vision Foundation</h2>
            <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight mb-4">Our Blood Donors</h1>
            <p class="text-blue-100 text-lg max-w-2xl mx-auto font-light leading-relaxed">
                Heroes walk among us. These dedicated individuals have pledged to save lives through the gift of blood. 
            </p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto px-4 py-12 flex-grow w-full">
        <!-- Search and Filter Bar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-10 flex flex-col sm:flex-row justify-between items-center gap-4 relative -mt-20 z-20">
            <div class="relative w-full sm:w-64">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search by name..." class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-royalBlue focus:ring-1 focus:ring-royalBlue bg-gray-50 focus:bg-white transition-all text-sm">
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <label class="text-xs font-bold text-gray-500 uppercase">Filter:</label>
                <select id="groupFilter" class="flex-grow sm:flex-grow-0 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-royalBlue focus:ring-1 focus:ring-royalBlue bg-gray-50 focus:bg-white text-sm font-medium">
                    <option value="all">All Groups</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
        </div>

        <!-- Donors Grid -->
        <div id="donorsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Donor Cards Will Render Here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="bg-gray-50 inline-flex p-6 rounded-full mb-4">
                <i class="fas fa-search text-4xl text-gray-300"></i>
            </div>
            <h3 class="text-xl font-bold text-darkBlue mb-2">No donors found</h3>
            <p class="text-gray-500">We couldn't find any donors matching your criteria.</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm text-gray-500">
                &copy; <script>document.write(new Date().getFullYear())</script> HSMV Foundation. All rights reserved. 
                <a href="blood-admin.html" class="text-royalBlue hover:underline ml-2"><i class="fas fa-lock text-xs mr-1"></i>Admin</a>
            </p>
        </div>
    </footer>

    <script>
        // PASTE YOUR GOOGLE SCRIPT WEB APP URL HERE
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLgbjITZNfDymYtXoRvxJRN2JbbvFPEAECEw0Ye9RHIOMMUPHLS-eWPf9SYix1jfVW/exec";
        
        const donorsGrid = document.getElementById('donorsGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const groupFilter = document.getElementById('groupFilter');

        let currentDonors = [];

        function getBloodGroupColor(group) {
            if(group.includes('O')) return 'bg-blue-50 text-blue-700 border-blue-200';
            if(group.includes('AB')) return 'bg-purple-50 text-purple-700 border-purple-200';
            return 'bg-red-50 text-brightRed border-red-200'; // Default for A and B
        }

        function renderDonors(filterText = '', filterGroup = 'all') {
            donorsGrid.innerHTML = '';
            
            const filtered = currentDonors.filter(donor => {
                const matchesName = donor.name.toLowerCase().includes(filterText.toLowerCase());
                const matchesGroup = filterGroup === 'all' || donor.group === filterGroup;
                return matchesName && matchesGroup;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                // Change grid to list layout
                donorsGrid.className = "flex flex-col gap-4";
                
                filtered.forEach((donor, index) => {
                    const item = document.createElement('div');
                    item.className = "donor-card bg-white border border-gray-100 rounded-xl p-4 sm:p-6 flex items-center justify-between fade-in shadow-sm";
                    item.style.animationDelay = `${index * 0.05}s`;
                    
                    const colorClass = getBloodGroupColor(donor.group);
                    
                    item.innerHTML = `
                        <div class="flex items-center gap-4 sm:gap-6">
                            <div class="w-12 h-12 sm:w-16 sm:h-16 bg-gray-50 rounded-full flex items-center justify-center border border-gray-100 text-gray-400 text-xl sm:text-2xl flex-shrink-0">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <h3 class="text-lg sm:text-xl font-bold text-darkBlue mb-1" title="${donor.name}">${donor.name}</h3>
                                <p class="text-xs sm:text-sm text-gray-400">Registered Blood Donor</p>
                            </div>
                        </div>
                        <div class="inline-flex flex-col items-center justify-center border px-4 py-2 rounded-xl font-black text-lg sm:text-xl ${colorClass} min-w-[80px]">
                            ${donor.group}
                        </div>
                    `;
                    donorsGrid.appendChild(item);
                });
            }
        }

        async function fetchDonors() {
            if(GOOGLE_SCRIPT_URL === "YOUR_WEB_APP_URL_HERE") {
                donorsGrid.innerHTML = '<div class="col-span-full text-center py-10 text-red-500 font-bold">Please add your Google Script URL in the code!</div>';
                return;
            }
            
            donorsGrid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400"><i class="fas fa-sync animate-spin text-3xl mb-4"></i><p>Loading donors from Google Sheets...</p></div>';
            
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + "?action=read");
                const data = await res.json();
                currentDonors = data;
                renderDonors(searchInput.value, groupFilter.value);
            } catch(error) {
                console.error(error);
                donorsGrid.innerHTML = '<div class="col-span-full text-center py-10 text-red-500">Failed to load data.</div>';
            }
        }

        // Event Listeners for Filtering
        searchInput.addEventListener('input', (e) => {
            renderDonors(e.target.value, groupFilter.value);
        });

        groupFilter.addEventListener('change', (e) => {
            renderDonors(searchInput.value, e.target.value);
        });

        // Initial Render
        document.addEventListener('DOMContentLoaded', fetchDonors);
    </script>
</body>
</html>
